<title>Z-Route Redemption — DPS</title>
<style>
:root {
  color-scheme: dark;
  --bg: #10141c;
  --panel: #191f2b;
  --line: #30394a;
  --text: #e9eef7;
  --muted: #a6b1c3;
  --accent: #75b7ff;
  --good: #80d6ad;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, "Segoe UI", "Noto Sans JP", "Noto Sans", sans-serif;
}
main { max-width: 1600px; margin: auto; }
.topbar {
  display: flex;
	justify-content: end;}
.lang {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
}
h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 6px; }
h2 { font-size: 18px; margin-top: 28px; }
p { color: var(--muted); }
a { color: var(--accent); }
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}
input, select, button {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  font: inherit;
}
input { flex: 1; min-width: 220px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
.status {
  padding: 12px;
  border-radius: 8px;
  background: var(--panel);
  margin: 12px 0;
}
.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 950px;
  font-variant-numeric: tabular-nums;
}
th, td {
  text-align: right;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th {
  background: #202838;
  position: sticky;
  top: 0;
  z-index: 1;
}
th:first-child, td:first-child { text-align: left; }
tbody tr:hover { background: #202838; }
.total { color: var(--good); font-weight: 700; }
.star { color: #ffd580; }
.muted { color: var(--muted); }
details {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 12px 0;
}
summary { cursor: pointer; font-weight: 600; }
footer { margin-top: 28px; color: var(--muted); }
@media (max-width: 600px) {
  body { padding: 12px; }
}
</style>
</head>

const LANG_KEY = "zroute-dps-lang";
let lang = "fr";
let status = { type: "loading" };

function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
  } catch (e) { /* stockage indisponible */ }

  const nav = (navigator.language || "fr").slice(0, 2).toLowerCase();
  return I18N[nav] ? nav : "fr";
}

function t(key, vars = {}) {
  const dict = I18N[lang] || I18N.fr;
  let text = dict[key] ?? I18N.fr[key] ?? key;
  for (const [name, value] of Object.entries(vars)) {
    text = text.replaceAll(`{${name}}`, value);
  }
  return text;
}

function starLabel(n) {
  return t(n === 1 ? "starOne" : "starMany", { n });
}

function renderStatus() {
  if (status.type === "loading") {
    $("status").textContent = t("loading");
  } else if (status.type === "loaded") {
    $("status").textContent = t("loaded", { n: status.count });
  } else {
    $("status").textContent = t("error", { e: status.message });
  }
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = t("pageTitle");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  document.querySelectorAll("[data-star]").forEach(el => {
    el.textContent = starLabel(Number(el.dataset.star));
  });

  $("search").placeholder = t("searchPlaceholder");
  $("lang").value = lang;

  renderStatus();
  render();
}

function setLanguage(newLang) {
  if (!I18N[newLang]) return;
  lang = newLang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignoré */ }
  applyLanguage();
}

/* Calculs                                                             */
/* ------------------------------------------------------------------ */

let heroes = {};
let rows = [];

const $ = id => document.getElementById(id);

function parsePercent(text) {
  if (!text) return null;

  // Extrait le coefficient de dégâts associé à ATK dans la description,
  // sans utiliser les bonus génériques de star_upgrades.
  const patterns = [
    /damage equal to\s*([\d.]+)\s*%\s*ATK/i,
    /dealing\s+([\d.]+)\s*%\s*ATK\s+damage/i,
    /deals?\s+([\d.]+)\s*%\s*ATK\s+damage/i,
    /damage of\s*([\d.]+)\s*%\s*ATK/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) return Number(match[1]);
  }

  return null;
}

function parseHits(text) {
  if (!text) return 1;

  const patterns = [
    /(\d+)\s+times\b/i,
    /(\d+)\s+consecutive attacks?\b/i,
    /attacks?\s+(\d+)\s+times\b/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) return Number(match[1]);
  }

  return 1;
}

function getTargets(text) {
  if (!text) return 1;

  const patterns = [
    /\b(?:attack|attacks|at|target|targets)\s+(\d+)\s+(?:random\s+)?(?:enemies|enemy|targets)\b/i,
    /(?:to|at)\s+(\d+)\s+(?:random\s+)?enemies\b/i,
    /(\d+)\s+(?:random\s+)?enemies\b/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) return Number(match[1]);
  }

  return 1;
}

function getSkill(hero, slot) {
  return (hero.skills || []).find(skill => skill.slot === slot) || null;
}

function getStarEntry(skill, star) {
  if (!skill || !Array.isArray(skill.by_star)) return null;
  return skill.by_star.find(entry => Number(entry.star) === star) || null;
}

function skillDps(skill, star) {
  const entry = getStarEntry(skill, star);
  if (!entry || !entry.text) {
    return { value: null, coefficient: null, cooldown: null };
  }

  const coefficient = parsePercent(entry.text);
  const cooldown = Number(skill.cooldown_s);
  const hits = parseHits(entry.text);
  const targets = getTargets(entry.text);

  if (
    coefficient === null ||
    !Number.isFinite(cooldown) ||
    cooldown <= 0
  ) {
    return {
      value: null,
      coefficient,
      cooldown: Number.isFinite(cooldown) ? cooldown : null
    };
  }

  return {
    value: coefficient * hits * targets / cooldown,
    coefficient,
    cooldown,
    hits,
    targets,
    description: entry.text
  };
}

function fmt(value) {
  if (value === null || !Number.isFinite(value)) return t("na");
  return value.toLocaleString(LOCALES[lang], {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function makeRow(heroId, hero, star) {
  const auto = skillDps(getSkill(hero, 1), star);
  const combat = skillDps(getSkill(hero, 2), star);

  // Une compétence sans coefficient de dégâts est ignorée.
  const combatDps =
    combat.coefficient === null || combat.coefficient === 0
      ? 0
      : combat.value;

  const total =
    auto.value !== null && combatDps !== null
      ? auto.value + combatDps
      : auto.value;

  return {
    id: heroId,
    name: hero.name || "",
    star,
    auto,
    combat: { ...combat, value: combatDps },
    total
  };
}

function allRows() {
  const result = [];

  for (const [id, hero] of Object.entries(heroes)) {
    for (let star = 1; star <= 5; star++) {
      result.push(makeRow(id, hero, star));
    }
  }

  return result;
}

// Nom affiché : celui du JSON, ou un libellé traduit par défaut.
function displayName(row) {
  return row.name || t("heroDefault", { id: row.id });
}

/* ------------------------------------------------------------------ */
/* Affichage                                                           */
/* ------------------------------------------------------------------ */

function render() {
  const query = $("search").value.trim().toLocaleLowerCase(LOCALES[lang]);
  const starFilter = $("star").value;
  const sort = $("sort").value;

  let filtered = rows.filter(row =>
    displayName(row).toLocaleLowerCase(LOCALES[lang]).includes(query)
  );

  if (starFilter !== "all") {
    filtered = filtered.filter(row => row.star === Number(starFilter));
  }

  filtered.sort((a, b) => {
    if (sort === "dps") {
      return (b.total ?? -Infinity) - (a.total ?? -Infinity);
    }
    if (sort === "auto") {
      return (b.auto.value ?? -Infinity) - (a.auto.value ?? -Infinity);
    }
    if (sort === "skill") {
      return (b.combat.value ?? -Infinity) - (a.combat.value ?? -Infinity);
    }

    return displayName(a).localeCompare(displayName(b), LOCALES[lang]) ||
           a.star - b.star;
  });

  const allStars = starFilter === "all";

  $("thead").innerHTML = `
    <tr>
      <th>${t("thHero")}</th>
      ${allStars ? `<th>${t("thStar")}</th>` : ""}
      <th>${t("thAuto")}</th>
      <th>${t("thSkill")}</th>
      <th>${t("thTotal")}</th>
    </tr>`;

  $("tbody").replaceChildren();

  const fragment = document.createDocumentFragment();

  for (const row of filtered) {
    const tr = document.createElement("tr");

    const cells = [
      displayName(row),
      ...(allStars ? [`${row.star} ★`] : []),
      fmt(row.auto.value),
      fmt(row.combat.value),
      fmt(row.total)
    ];

    cells.forEach((value, index) => {
      const td = document.createElement("td");
      td.textContent = value;

      if (index === 0) td.title = `ID : ${row.id}`;
      if (index === cells.length - 1) td.className = "total";
      if (allStars && index === 1) td.className = "star";

      tr.appendChild(td);
    });

    fragment.appendChild(tr);
  }

  $("tbody").appendChild(fragment);
  $("summary").textContent =
    t("summary", { shown: filtered.length, total: rows.length });
}

function exportCsv() {
  const query = $("search").value.trim().toLocaleLowerCase(LOCALES[lang]);
  const starFilter = $("star").value;

  const filtered = rows.filter(row =>
    displayName(row).toLocaleLowerCase(LOCALES[lang]).includes(query) &&
    (starFilter === "all" || row.star === Number(starFilter))
  );

  const header = [
    t("csvId"), t("csvHero"), t("csvStars"),
    t("csvAuto"), t("csvSkill"), t("csvTotal")
  ];

  const escape = value =>
    '"' + String(value ?? "").replace(/"/g, '""') + '"';

  const lines = [header.map(escape).join(";")];

  for (const row of filtered) {
    lines.push([
      row.id, displayName(row), row.star,
      row.auto.value ?? "",
      row.combat.value ?? "",
      row.total ?? ""
    ].map(escape).join(";"));
  }

  const blob = new Blob(
    ["\uFEFF" + lines.join("\r\n")],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "zroute-redemption-dps.csv";
  link.click();
  URL.revokeObjectURL(url);
}

async function init() {
  try {
    const response = await fetch(DATA_URL);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();
    heroes = data.heroes || {};
    rows = allRows();

    status = { type: "loaded", count: Object.keys(heroes).length };
    renderStatus();
    render();
  } catch (error) {
    console.error(error);
    status = { type: "error", message: error.message };
    renderStatus();
  }
}

$("search").addEventListener("input", render);
$("star").addEventListener("change", render);
$("sort").addEventListener("change", render);
$("export").addEventListener("click", exportCsv);
$("lang").addEventListener("change", e => setLanguage(e.target.value));

lang = detectLang();
applyLanguage();
init();
</script>
</body>
</html>
